# Written from docs/spec.md sections 4, 12 and issue #16 decisions 5-7 for tests/inventory/selected.yml:
# overridden subnet, Portal subdomain and no help host in the lists (unlisted hosts are open already).
profile: production
public_origin: https://portal.example.org
trusted_proxy: 10.250.0.10
