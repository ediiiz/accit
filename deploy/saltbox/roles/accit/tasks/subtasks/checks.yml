---
# Every check here fails the run, except the public-address probe, which reports when it cannot run.
- name: Checks | Read Traefik's version
  ansible.builtin.command: docker exec {{ accit_traefik }} traefik version
  register: accit_traefik_version
  changed_when: false

- name: Checks | Require Traefik v3.7.16 or later
  ansible.builtin.assert:
    that: error | length == 0
    fail_msg: "{{ error }}: pin traefik_role_docker_image_tag to a later release, then sb install traefik."
    quiet: true
  vars:
    error: "{{ accit_traefik_version.stdout | accit_traefik_version_error('3.7.16') }}"

- name: Checks | Inspect accit
  ansible.builtin.command: docker inspect {{ accit_container }}
  register: accit_inspect
  changed_when: false

- name: Checks | Require accit's pinned address
  ansible.builtin.assert:
    that: ((accit_inspect.stdout | from_json)[0].NetworkSettings.Networks[accit_name].IPAddress | default('')) == address
    fail_msg: "accit is not at {{ address }} on the {{ accit_name }} network."
    quiet: true
  vars:
    address: "{{ lookup('role_var', '_network_accit_address', role='accit') }}"

- name: Checks | Run accit admin check
  ansible.builtin.command: docker exec {{ accit_container }} /accit admin check
  register: accit_admin_check
  changed_when: false

- name: Checks | Show accit admin check
  ansible.builtin.debug:
    msg: "{{ accit_admin_check.stdout_lines }}"

# Over localhost inside Traefik, so the role never publishes the API. Never the set-token middleware:
# its configuration holds the token.
- name: Checks | Read Traefik's API
  ansible.builtin.command:
    argv:
      - "docker"
      - "exec"
      - "{{ accit_traefik }}"
      - "wget"
      - "-q"
      - "-O"
      - "-"
      - "--header"
      - "Host: traefik"
      - "http://localhost:8080/api/http/{{ item }}"
  loop:
    - middlewares/accit@file
    - middlewares/accit-delete-token@file
    - routers?per_page=10000
  register: accit_api
  until: accit_api.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: Checks | Require the chain to remove the token before any app
  ansible.builtin.assert:
    that: error | length == 0
    fail_msg: "{{ error }}"
    quiet: true
  vars:
    error: "{{ (accit_api.results[0].stdout | from_json) | accit_chain_error(accit_api.results[1].stdout | from_json) }}"

- name: Checks | Classify routers
  ansible.builtin.set_fact:
    accit_coverage: "{{ accit_api.results[2].stdout | from_json | accit_coverage(policy) }}"
    accit_portal_host: "{{ portal }}"
  vars:
    portal: "{{ lookup('role_var', '_web_host_lookup', role='accit') }}"
    policy: "{{ lookup('role_var', '_protection_lookup', role='accit') | combine({'portal': portal}) }}"

- name: Checks | Pick the probe hosts
  ansible.builtin.set_fact:
    accit_gated_host: "{{ (rows | selectattr('state', 'equalto', 'Gated') | map(attribute='host') | list + [''])[0] }}"
    accit_public_address: "{{ ip_address_public | default('') }}"
    accit_websecure: "{{ (accit_traefik_inspect.stdout | from_json)[0] | accit_traefik_websecure }}"
  vars:
    rows: "{{ accit_coverage | selectattr('entrypoint', 'equalto', 'websecure') | rejectattr('host', 'equalto', '*') | list }}"

- name: Checks | Require a published websecure port
  ansible.builtin.assert:
    that: accit_websecure.error | length == 0
    fail_msg: "{{ accit_websecure.error }}"
    quiet: true

# Prints the body, then the status code on its own line. HTTP/1.1: under h2 the curl exit code for a
# TLS 1.3 certificate-required alert depends on the curl version.
- name: Checks | Probe through Traefik
  ansible.builtin.command:
    argv:
      - "curl"
      - "-sS"
      - "-k"
      - "--http1.1"
      - "--max-time"
      - "10"
      - "-w"
      - "\n%{http_code}"
      - "--connect-to"
      - "{{ item.host }}:443:{{ item.address }}:{{ accit_websecure.port }}"
      - "https://{{ item.host }}/"
  loop: "{{ probes | selectattr('host') | selectattr('address') | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: accit_probes
  changed_when: false
  failed_when: false
  vars:
    probes:
      - { key: gated, host: "{{ accit_gated_host }}", address: "{{ accit_websecure.address }}" }
      - { key: portal, host: "{{ accit_portal_host }}", address: "{{ accit_websecure.address }}" }
      - { key: public_gated, host: "{{ accit_gated_host }}", address: "{{ accit_public_address }}" }

- name: Checks | Index the probes
  ansible.builtin.set_fact:
    accit_probe: "{{ dict(accit_probes.results | map(attribute='item.key') | zip(accit_probes.results)) }}"

# From the host accit sees a Docker address and denies it at step 3: this shows the chain is attached.
- name: Checks | Require a Gated host to deny without a Grant
  ansible.builtin.assert:
    that: accit_probe.gated.stdout_lines[-1:] == ['403'] and accit_probe.gated.stdout_lines[:1] == ['Forbidden']
    fail_msg: "{{ accit_gated_host }} answered {{ accit_probe.gated.stdout_lines[-1:] }} (curl exit {{ accit_probe.gated.rc }}), not 403 Forbidden."
    quiet: true
  when: accit_gated_host | length > 0

- name: Checks | Note an empty selection
  ansible.builtin.debug:
    msg: "No Gated router in Traefik: nothing to probe."
  when: accit_gated_host | length == 0

# The Portal reports the Address accit sees on this path and whether a Trusted network or a Grant lets it
# through. Needs the generated certificate.
- name: Checks | Read the Portal's status through the public address
  ansible.builtin.shell: |
    set -euo pipefail
    password=$(cat "{{ accit_pki_dir }}/client.p12.password")
    printf 'cert = "%s:%s"\n' "{{ accit_pki_dir }}/client.p12" "$password" \
      | curl -K - --cert-type P12 -sS -k --max-time 10 -w '\n%{http_code}' \
          --connect-to "{{ accit_portal_host }}:443:{{ accit_public_address }}:{{ accit_websecure.port }}" \
          "https://{{ accit_portal_host }}/api/status"
  args:
    executable: /bin/bash
  register: accit_public_status
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - "'public_gated' in accit_probe"
    - lookup('role_var', '_client_ca_file', role='accit') | length == 0

- name: Checks | Judge the public-address probe
  ansible.builtin.set_fact:
    accit_public: "{{ accit_public_status | accit_public_probe(accit_probe.public_gated) }}"
  when: accit_public_status is not skipped

- name: Checks | Require a Gated host to deny a public Address
  ansible.builtin.assert:
    that: accit_public.outcome != 'failed'
    fail_msg: "Through {{ accit_public_address }}: {{ accit_public.reason }} ({{ accit_gated_host }})."
    quiet: true
  when: accit_public is defined

- name: Checks | Report the public-address probe
  ansible.builtin.debug:
    msg: "Public-address probe {{ outcome }}{{ (': ' ~ reason) if reason }}"
  vars:
    outcome: "{{ accit_public.outcome | default('skipped') }}"
    reason: "{{ accit_public.reason | default('no public address, Gated host or generated client certificate') }}"

# 35: handshake failure; 56: TLS 1.3 alert after the handshake. Anything else is doubt, not mTLS.
- name: Checks | Require the Portal to refuse a missing client certificate
  ansible.builtin.assert:
    that: accit_probe.portal.rc in [35, 56]
    fail_msg: "{{ accit_portal_host }} without a client certificate: curl exit {{ accit_probe.portal.rc }}, not a TLS failure."
    quiet: true

- name: Checks | Open a TLS session to the Portal
  ansible.builtin.command:
    argv:
      - "timeout"
      - "10"
      - "openssl"
      - "s_client"
      - "-connect"
      - "{{ accit_websecure.address }}:{{ accit_websecure.port }}"
      - "-servername"
      - "{{ accit_portal_host }}"
    stdin: Q
  register: accit_portal_tls
  changed_when: false
  failed_when: "'Server certificate' not in accit_portal_tls.stdout"

# The role holds the bundle only when it generated the PKI.
- name: Checks | Open the Portal with the shared certificate
  ansible.builtin.shell: |
    set -euo pipefail
    password=$(cat "{{ accit_pki_dir }}/client.p12.password")
    printf 'cert = "%s:%s"\n' "{{ accit_pki_dir }}/client.p12" "$password" \
      | curl -K - --cert-type P12 -sS -k --max-time 10 -o /dev/null -w '%{http_code}' \
          --connect-to "{{ accit_portal_host }}:443:{{ accit_websecure.address }}:{{ accit_websecure.port }}" \
          "https://{{ accit_portal_host }}/"
  args:
    executable: /bin/bash
  register: accit_portal_with
  changed_when: false
  failed_when: accit_portal_with.rc != 0 or accit_portal_with.stdout == '000'
  when: lookup('role_var', '_client_ca_file', role='accit') | length == 0
