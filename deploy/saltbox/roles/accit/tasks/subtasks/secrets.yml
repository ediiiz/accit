---
# The proxy token and the .p12 password are generated on the host and never pass through Ansible's output.
- name: Secrets | Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # Read-only to accit: config and token.
    - { path: "{{ accit_config_dir }}", owner: root, group: "{{ gid }}", mode: "0750" }
    - { path: "{{ accit_data_dir }}", owner: "{{ uid }}", group: "{{ gid }}", mode: "0700" }
    - { path: "{{ accit_backups_dir }}", owner: root, group: root, mode: "0700" }

- name: Secrets | Look for the proxy token
  ansible.builtin.stat:
    path: "{{ accit_config_dir }}/proxy-token"
  register: accit_token_file

- name: Secrets | Generate the proxy token
  ansible.builtin.shell: |
    set -eu
    umask 077
    openssl rand -hex 32 > "{{ accit_config_dir }}/proxy-token.new"
    mv "{{ accit_config_dir }}/proxy-token.new" "{{ accit_config_dir }}/proxy-token"
  register: accit_token_generated
  changed_when: true
  when: (accit_rotate_proxy_token | default(false) | bool) or not accit_token_file.stat.exists

- name: Secrets | Restrict the proxy token
  ansible.builtin.file:
    path: "{{ accit_config_dir }}/proxy-token"
    owner: root
    group: "{{ gid }}"
    mode: "0640"

- name: Secrets | Look for the client CA
  ansible.builtin.stat:
    path: "{{ accit_pki_dir }}/ca.pem"
  register: accit_pki_ca

# scripts/client-ca: CA plus one shared leaf, legacy .p12 encoding; the CA key exists only while it runs.
- name: Secrets | Generate the client CA and shared certificate
  ansible.builtin.shell: |
    set -eu
    umask 077
    ACCIT_P12_PASSWORD=$(openssl rand -base64 24)
    export ACCIT_P12_PASSWORD
    "{{ role_path }}/files/client-ca" {{ 'rotate' if accit_pki_ca.stat.exists else 'create' }} "{{ accit_pki_dir }}"
    printf '%s\n' "$ACCIT_P12_PASSWORD" > "{{ accit_pki_dir }}/client.p12.password"
  register: accit_pki_generated
  changed_when: true
  when:
    - lookup('role_var', '_client_ca_file', role='accit') | length == 0
    - (accit_rotate_client_ca | default(false) | bool) or not accit_pki_ca.stat.exists

- name: Secrets | Show the new client CA
  ansible.builtin.debug:
    msg: "{{ accit_pki_generated.stdout_lines + ['Hand out ' ~ accit_pki_dir ~ '/client.p12; its password is in client.p12.password. Send them by different routes.'] }}"
  when: accit_pki_generated is not skipped

- name: Secrets | Install the client CA certificate for accit
  ansible.builtin.copy:
    src: "{{ lookup('role_var', '_client_ca_file', role='accit') or (accit_pki_dir ~ '/ca.pem') }}"
    dest: "{{ accit_config_dir }}/client-ca.pem"
    remote_src: true
    owner: root
    group: "{{ gid }}"
    mode: "0644"

- name: Secrets | Read the client CA certificate
  ansible.builtin.slurp:
    src: "{{ accit_config_dir }}/client-ca.pem"
  register: accit_client_ca

- name: Secrets | Read the proxy token
  ansible.builtin.slurp:
    src: "{{ accit_config_dir }}/proxy-token"
  register: accit_token
  no_log: true

- name: Secrets | Keep secrets for the Traefik dynamic file
  ansible.builtin.set_fact:
    accit_proxy_token: "{{ accit_token.content | b64decode | trim }}"
    accit_client_ca_pem: "{{ accit_client_ca.content | b64decode }}"
  no_log: true
