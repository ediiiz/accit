---
- name: Config | Read the live accit.yaml
  ansible.builtin.slurp:
    src: "{{ accit_config_dir }}/accit.yaml"
  register: accit_live_config
  failed_when: false

# The candidate is checked by the pinned image before it replaces the live file.
- name: Config | Render accit.yaml
  ansible.builtin.template:
    src: accit.yaml.j2
    dest: "{{ accit_config_dir }}/accit.yaml"
    owner: root
    group: "{{ gid }}"
    mode: "0640"
    validate: >-
      docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 0:0
      -v {{ accit_config_dir }}:/config:ro -v %s:/candidate.yaml:ro
      {{ lookup('role_var', '_docker_image', role='accit') }} admin check /candidate.yaml

- name: Config | Decide between reload and restart
  ansible.builtin.set_fact:
    accit_config_change: "{{ live | accit_config_change(lookup('template', 'accit.yaml.j2') | from_yaml) }}"
  vars:
    live: "{{ (accit_live_config.content | b64decode | from_yaml) if (accit_live_config.content is defined) else none }}"
