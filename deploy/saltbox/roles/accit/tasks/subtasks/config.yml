---
- name: Config | Read the live accit.yaml
  ansible.builtin.slurp:
    src: "{{ accit_config_dir }}/accit.yaml"
  register: accit_live_config
  failed_when: false

- name: Config | Read a pending change
  ansible.builtin.slurp:
    src: "{{ accit_location }}/config-pending"
  register: accit_config_pending
  failed_when: false

- name: Config | Decide between reload and restart
  ansible.builtin.set_fact:
    accit_config_change: "{{ live | accit_config_change(lookup('template', 'accit.yaml.j2') | from_yaml, pending) }}"
  vars:
    live: "{{ (accit_live_config.content | b64decode | from_yaml) if (accit_live_config.content is defined) else none }}"
    pending: "{{ (accit_config_pending.content | b64decode) if (accit_config_pending.content is defined) else '' }}"

# Once the live file is replaced, a failed run would leave the change unapplied: ready.yml clears this after applying it.
- name: Config | Record the pending change
  ansible.builtin.copy:
    content: "{{ accit_config_change }}\n"
    dest: "{{ accit_location }}/config-pending"
    owner: root
    group: root
    mode: "0644"
  when: accit_config_change | length > 0

# The candidate is checked by the pinned image before it replaces the live file.
- name: Config | Render accit.yaml
  ansible.builtin.template:
    src: accit.yaml.j2
    dest: "{{ accit_config_dir }}/accit.yaml"
    owner: root
    group: "{{ gid }}"
    mode: "0640"
    validate: >-
      docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 0:0
      -v {{ accit_config_dir }}:/config:ro -v %s:/candidate.yaml:ro
      {{ lookup('role_var', '_docker_image', role='accit') }} admin check /candidate.yaml
