name: Check

# Web gates + fast tests for every change. The server has its own workflow
# (rust.yml). Nothing here needs a database, a browser server, or secrets:
#
#   lint      oxlint (incl. the vendored anti-slop plugins) + eslint for .svelte
#   format    oxfmt --check
#   typecheck svelte-check
#   unit      Vitest unit tests (Node, no browser)
#   component Vitest browser-mode component tests (headless Chromium)
#
# The Playwright e2e lane is deliberately NOT here: it builds the app and boots
# a preview server, so it belongs in its own (slower) workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # --ignore-scripts: the web app's `prepare` runs `playwright install`,
      # which downloads every browser. The component tests only need Chromium,
      # installed explicitly below; `svelte-kit sync` runs via `prebuild`/
      # `typecheck` when it is actually needed.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # SvelteKit 3 writes `node_modules/$app` (the tsconfig apps/web extends)
      # in `svelte-kit sync`, which `--ignore-scripts` skipped above.
      - name: Sync SvelteKit
        working-directory: apps/web
        run: bunx svelte-kit sync

      # `$lib/paraglide/*` is generated by the Vite plugin at dev/build time, so
      # a fresh checkout has none of it and svelte-check cannot resolve it.
      - name: Compile paraglide messages
        working-directory: apps/web
        run: bunx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run web:test:unit

      - name: Install Chromium for component tests
        run: bunx playwright install --with-deps chromium

      - name: Component tests
        run: bun run web:test:component
